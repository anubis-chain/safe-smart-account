[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.7.6"
optimizer = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@safe-global/safe-smart-account/=lib/safe-smart-account/",
    "@openzeppelin/=lib/safe-smart-account/node_modules/@openzeppelin/",
]

[fmt]
line_length = 120

[rpc_endpoints]
anubis = "https://rpc.anubispace.org"
